<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>北 강철비 비행장 타격 장표 4장</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>/* 이브리프 장표 디자인 — 가로형 4:3. 논리 400×300 (1080×810 = 2.7배, 기존 대비 모든 요소 20% 확대) */
:root {
  --room: #0e1012; --room-fg: #c9cdd2;
  --page: #f9f7f2; --fg: #1d1a17; --muted: #5f5a53; --line: #d9d3c7;
  --accent: #C8161D; --mark: rgba(255, 165, 0, .68);
  --mast: #F2F0EE; --mast-line: #E3DFDB;
  --land: #e4ddd0; --sea: #f2efe8; --coast: #b8ad99;
  --font-head: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--room); color: var(--room-fg); font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; }
.slot { position: relative; width: min(480px, 100%); aspect-ratio: 4 / 3; }
.card { position: absolute; left: 0; top: 0; width: 400px; height: 300px; transform-origin: 0 0;
  background: var(--page); color: var(--fg); overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }
.col { width: 360px; margin: 0 auto; }
.mast { background: var(--mast); border-bottom: 1px solid var(--mast-line); }
.mast .col { display: flex; align-items: center; height: 36.3px; }
.mast img { display: block; height: 22px; width: auto; }
.nav { background: #f1eee8; border-top: 1px solid var(--line); border-bottom: 2.2px solid var(--accent); }
.nav .col { display: flex; gap: 17.6px; padding-block: 5.5px; font-size: 14.85px; font-weight: 700; color: #4a453f; line-height: 1.6; }
.nav .on { color: #fff; background: var(--accent); margin-block: -5.5px; padding: 5.5px 9.9px; }
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.foot { border-top: 1px solid var(--line); }
.foot .col { display: flex; justify-content: space-between; align-items: center; height: 30px; font-size: 12.5px; color: var(--muted); }
.foot b { color: var(--fg); font-weight: 700; }
mark { background: linear-gradient(transparent 52%, var(--mark) 52%, var(--mark) 100%); color: inherit; border-radius: 0; }
.crumb { font-size: 14px; color: var(--muted); display: flex; gap: 8px; }
.crumb b { color: var(--accent); font-weight: 700; }
.headline { font-family: var(--font-head); font-weight: 900; font-size: 40px; line-height: 1.3; letter-spacing: -0.03em; margin: 10px 0 0; word-break: keep-all; }
.by { display: flex; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: 12px; font-family: var(--font-body); }
.by strong { color: var(--fg); }
.by i { font-style: normal; color: #b9bdb8; }
.by time { font-family: var(--font-head); }
.deck { margin-top: 26px; border-left: 3px solid var(--accent); padding-left: 16px; font-family: var(--font-head);
  font-weight: 700; font-size: 22px; line-height: 1.5; color: #2b2723; word-break: keep-all; }
.kicker { font-family: var(--font-head); font-weight: 900; font-size: 27px; letter-spacing: -0.03em; line-height: 1.3; margin: 0; }
.kicker-rule { width: 44px; height: 2px; background: var(--accent); margin: 0 0 10px; }
.items { list-style: none; margin: 10px 0 0; padding: 0; }
.items li { display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; padding: 13px 0 14px; border-top: 1px solid var(--line); }
.items li:last-child { border-bottom: 1px solid var(--line); }
.badge { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 3px; }
.items h3 { margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 21px; line-height: 1.35; letter-spacing: -0.02em; }
.items p { margin: 3px 0 0; font-size: 16.5px; line-height: 1.6; word-break: keep-all; letter-spacing: -0.01em; }
.lede { margin: 16px 0 0; font-size: 20px; line-height: 1.7; word-break: keep-all; letter-spacing: -0.01em; }
.lede + .lede { margin-top: 12px; }
.map { margin-top: 14px; }
.map svg { display: block; width: 360px; height: auto; }
.map + .lede { margin-top: 12px; font-size: 16.5px; line-height: 1.65; }
.verdict { display: flex; flex-direction: column; align-items: center; text-align: center; }
.verdict .label { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
.q-rule { width: 44px; height: 2px; background: var(--accent); }
.verdict .q-rule.top { margin-top: 14px; }
.big { font-family: var(--font-head); font-weight: 900; font-size: 33px; line-height: 1.4; letter-spacing: -0.03em; margin: 20px 0 22px; word-break: keep-all; }
.big.q { font-size: 28px; line-height: 1.45; }
.cite { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); }
.verdict .sub { margin: 22px 0 0; font-size: 17.28px; line-height: 1.75; word-break: keep-all; max-width: 410px; }
.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; list-style: none; margin: 24px 0 0; padding: 0; }
.tags li { padding: 4px 11px; border: 1px solid var(--line); font-size: 13.5px; color: #4a453f; }
.src { font-size: 11.5px; color: var(--muted); }
.tl { list-style: none; margin: 14px 0 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 74px 1fr; column-gap: 14px; padding: 13px 0 14px; border-top: 1px solid var(--line); }
.tl li:last-child { border-bottom: 1px solid var(--line); }
.tl .d { font-family: var(--font-head); font-weight: 900; font-size: 19px; color: var(--accent); line-height: 1.45; }
.tl h3 { margin: 0; font-family: var(--font-head); font-weight: 900; font-size: 20px; line-height: 1.4; letter-spacing: -0.02em; word-break: keep-all; }
.tl p { margin: 3px 0 0; font-size: 15.5px; line-height: 1.6; color: var(--muted); word-break: keep-all; }

.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.cmp > div { border: 1px solid var(--line); border-top: 3px solid var(--accent); background: #fffdf8; padding: 14px 16px 16px; }
.cmp > div.no { border-top-color: #8a847b; }
.cmp .yr { font-family: var(--font-head); font-weight: 900; font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; }
.cmp .chip { display: inline-block; margin-top: 8px; padding: 2px 9px; font-size: 13.5px; font-weight: 700; color: #fff; background: var(--accent); }
.cmp .no .chip { background: #8a847b; }
.cmp p { margin: 10px 0 0; font-size: 16.5px; line-height: 1.6; word-break: keep-all; }
.outlook { margin: 18px 0 0; font-size: 18px; line-height: 1.7; word-break: keep-all; }
.tags.left { justify-content: flex-start; margin-top: 16px; }

.photo { margin: 14px 0 0; }
.photo img { display: block; width: 440px; height: 200px; object-fit: cover; }
.photo figcaption { margin-top: 7px; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.photo + .lede { margin-top: 14px; }

/* 4:3 추가 부품 */
.headline { font-size: 38px; }
.deck { margin-top: 20px; font-size: 21px; }
.runway { margin: 14px 0 0; }
.runway svg { display: block; width: 360px; height: auto; }
.map { margin: 14px 0 0; }
.map figcaption { margin-top: 5px; font-size: 11.5px; color: var(--muted); }
.cmp > div { padding: 12px 12px 14px; }
.cmp .yr { margin-top: 8px; }
.cmp .chip { margin-top: 0; }
.runway figcaption { margin-top: 6px; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); }
.runway + .lede { margin-top: 12px; font-size: 18px; line-height: 1.65; }
.map + .lede { font-size: 17px; }
.cmp .yr { font-size: 25px; }
.cmp p { font-size: 16px; }
.outlook { margin-top: 16px; }
/* 본문 장표는 위쪽 정렬: 빨간 띠·키커 위치를 모든 장에서 통일 */
.main.top { justify-content: flex-start; padding-top: 14px; }
/* 본문 장표 키커는 표시 없이 글자만(빨간 세로 막대는 표지 부제 전용) */
.kicker { line-height: 1.15; }
